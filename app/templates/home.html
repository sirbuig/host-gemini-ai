<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FMInatorul API</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #74ebd5, #9face6);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: #333;
            }
            .container {
                text-align: center;
                background: white;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }
            h1 {
                color: #2c3e50;
                margin-bottom: 20px;
            }
            p {
                margin-bottom: 30px;
                font-size: 1.1em;
            }
            .button {
                display: inline-block;
                padding: 10px 20px;
                font-size: 1em;
                color: white;
                background: #3498db;
                border: none;
                border-radius: 5px;
                text-decoration: none;
                cursor: pointer;
                transition: background 0.3s ease;
            }
            .button:hover {
                background: #2980b9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Welcome to FMInatorul API</h1>
            <p>You can log in as an ADMIN to access and manage the API.</p>
            <a href="/admin/login" class="button">Admin Login</a>
        </div>
    </body>
    </html>
