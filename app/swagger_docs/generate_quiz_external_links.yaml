      Generate Questions and Answers from a PDF.
      ---
      tags:
        - PDF Processing
      parameters:
        - name: file
          in: formData
          type: file
          required: true
          description: The PDF file to process.
      responses:
        200:
          description: Successfully processed the PDF.
          examples:
            application/json: 
              {
                "questions": [
                  {
                    "question": "Example Question",
                    "choices": {
                      "A": "Choice A",
                      "B": "Choice B",
                      "C": "Choice C",
                      "D": "Choice D"
                    },
                    "answer": "A"
                  }
                ],
                "external-links":["examplelink.com", "examplelink2.com", "etc.com"]
              }
        400:
          description: Invalid request or error processing the file.
          examples:
            application/json: 
              {
                "error": "No file uploaded!"
              }
        401:
          description: Unauthorized access. Authentication failed.
          examples:
            application/json:
              {
                "error": "Authentification error : ..."
              }